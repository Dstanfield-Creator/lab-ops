---
# Defaults for the common role. Override in group_vars/ or host_vars/,
# never edit secrets in here. See group_vars/all.example.yml.

# Admin user created on every host and added to the sudo group.
admin_user: admin
admin_groups:
  - sudo

# Public key placed in the admin user's authorized_keys. Replace with your own.
# Keep the private half in 1Password or your SSH agent - never in git.
admin_ssh_public_key: "ssh-ed25519 AAAAEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLE admin@example.com"

# Management subnet allowed to reach SSH through the host firewall.
# RFC 5737 documentation range - replace with your real mgmt subnet.
mgmt_subnet: 192.0.2.0/24

# Tailscale interface allowed through the firewall for remote access.
tailscale_iface: tailscale0

# SSH group permitted to log in (AllowGroups in sshd_config).
ssh_allow_group: ssh-users

# Baseline packages installed on every host.
baseline_packages:
  - qemu-guest-agent
  - ufw
  - unattended-upgrades

# Set true only once you have confirmed out-of-band access works.
# See the firewall dead-man note in tasks/main.yml before changing this.
ufw_enabled: false
