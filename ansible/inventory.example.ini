# Example inventory. Copy to inventory.ini and edit for your hosts.
# Addresses are RFC 5737 documentation space - replace with your own.

[lab]
docker-host  ansible_host=192.0.2.10
paperclip    ansible_host=192.0.2.20

[lab:vars]
ansible_user=admin
ansible_python_interpreter=/usr/bin/python3
# Per-host or per-group overrides live in group_vars/ and host_vars/.
# Secrets belong in Ansible Vault, not here.
